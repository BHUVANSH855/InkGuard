<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InkGuard — Scan text</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/landing.css">
  <style>
    body{background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
    .scan-wrap{max-width:900px;margin:60px auto;padding:0 24px;width:100%}
    .back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px}
    .back:hover{color:var(--text)}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
    .panel-head{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
    #editor{min-height:200px;padding:16px;font-size:14px;line-height:1.8;outline:none;color:var(--text);font-family:var(--sans);white-space:pre-wrap}
    #editor:empty::before{content:attr(data-ph);color:var(--muted)}
    .panel-foot{background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
    .btn-run{padding:8px 18px;background:var(--accent);color:#020617;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
    .btn-run:hover{filter:brightness(1.08)}
    .results{display:none}
    .score-bar-wrap{display:flex;align-items:center;gap:16px;padding:16px;background:var(--surface);border-radius:8px;margin-bottom:16px}
    .score-num{font-size:32px;font-weight:700;min-width:60px}
    .score-grade{font-size:13px;color:var(--muted)}
    .bar{height:8px;border-radius:4px;background:var(--surface2);flex:1;overflow:hidden}
    .bar-fill{height:100%;border-radius:4px;transition:width .4s}
    .err-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:8px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
    .err-card[data-cat=style]{border-color:#4ade80}
    .err-card[data-cat=article]{border-color:#f59e0b}
    .err-card[data-cat=punctuation]{border-color:#38bdf8}
    .err-card[data-cat=pronoun]{border-color:#8b5cf6}
    .err-card[data-cat=clarity]{border-color:#a78bfa}
    .lbl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase}
    .lbl.e{background:rgba(248,113,113,.15);color:var(--red)}
    .lbl.f{background:rgba(74,222,128,.12);color:var(--green)}
    .lbl.w{background:rgba(56,189,248,.1);color:#7dd3fc}
    .val{font-size:13px}
  </style>
</head>
<body>
<div class="scan-wrap">
  <a href="/dashboard" class="back">← Back to dashboard</a>
  <div class="panel">
    <div class="panel-head">
      <span>Input text</span>
      <span id="wc" style="font-weight:400">0 words</span>
    </div>
    <div id="editor" contenteditable="true" data-ph="Paste your documentation here…" spellcheck="false"></div>
    <div class="panel-foot">
      <span style="font-size:12px;color:var(--muted)">Code blocks and CLI flags are automatically skipped</span>
      <button class="btn-run" id="runBtn">Analyse</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="panel">
      <div class="panel-head">Results</div>
      <div style="padding:16px">
        <div class="score-bar-wrap">
          <div>
            <div class="score-num" id="scoreNum">—</div>
            <div class="score-grade" id="scoreGrade"></div>
          </div>
          <div class="bar"><div class="bar-fill" id="barFill" style="width:0"></div></div>
        </div>
        <div id="corrected" style="background:rgba(34,211,238,.04);border:1px solid rgba(34,211,238,.15);border-radius:8px;padding:14px;font-size:14px;line-height:1.8;margin-bottom:16px"></div>
        <div id="errList"></div>
      </div>
    </div>
  </div>
</div>
<script>
const ed=document.getElementById("editor"),wc=document.getElementById("wc");
ed.addEventListener("input",()=>{const t=ed.innerText.trim();wc.textContent=(t?t.split(/\s+/).length:0)+" words"});
document.getElementById("runBtn").addEventListener("click",async()=>{
  const text=ed.innerText.trim();if(!text)return;
  const btn=document.getElementById("runBtn");btn.textContent="Analysing…";btn.disabled=true;
  try{
    const res=await fetch("/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,source:"dashboard"})});
    const d=await res.json();
    document.getElementById("results").style.display="block";
    const score=d.score??0;
    document.getElementById("scoreNum").textContent=score;
    document.getElementById("scoreGrade").textContent=`Grade ${d.grade} · ${d.error_count} issue(s) · ${d.word_count} words · ${d.skipped_regions||0} region(s) skipped`;
    const fill=document.getElementById("barFill");
    fill.style.width=score+"%";
    fill.style.background=score>=90?"#4ade80":score>=70?"#fbbf24":"#f87171";
    document.getElementById("corrected").textContent=d.corrected;
    const list=document.getElementById("errList");list.innerHTML="";
    (d.errors||[]).forEach(e=>{
      const c=document.createElement("div");
      c.className="err-card";c.dataset.cat=e.category||"agreement";
      c.innerHTML=`<span class="lbl e">Error</span><span class="val">"${esc(e.issue)}"</span>
        <span class="lbl f">Fix</span><span class="val">${esc(e.correction)}</span>
        <span class="lbl w">Rule</span><span class="val">${esc(e.message)}</span>`;
      list.appendChild(c);
    });
  }catch(err){alert("Request failed")}
  finally{btn.textContent="Analyse";btn.disabled=false;}
});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
</script>
</body></html>
