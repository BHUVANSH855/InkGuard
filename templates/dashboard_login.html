<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InkGuard — Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/landing.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh}
    .login-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:40px;width:360px;text-align:center}
    .login-logo{margin-bottom:24px}
    .login-title{font-size:22px;font-weight:700;margin-bottom:8px}
    .login-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
    .gh-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;background:#fff;color:#0f172a;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;transition:filter .15s}
    .gh-btn:hover{filter:brightness(.95)}
    .gh-btn svg{flex-shrink:0}
    .demo-note{margin-top:20px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
      <rect width="24" height="24" rx="6" fill="#0f172a"/>
      <path d="M5 8h14M5 12h10M5 16h12" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="20" cy="16" r="2.5" fill="#22d3ee"/>
    </svg>
  </div>
  <div class="login-title">Sign in to InkGuard</div>
  <div class="login-sub">View your documentation quality dashboard and scan history.</div>
  {% if has_oauth %}
  <a href="/auth/github" class="gh-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    Continue with GitHub
  </a>
  {% else %}
  <div style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:16px;font-size:13px;color:#fbbf24">
    GitHub OAuth not configured.<br>Set <code>GITHUB_CLIENT_ID</code> and <code>GITHUB_CLIENT_SECRET</code>.
  </div>
  {% endif %}
  <p class="demo-note">Only your GitHub username and avatar are read. No repository access.</p>
</div>
</body></html>
